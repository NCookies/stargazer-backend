name: Deploy to EC2 with Docker

on:
    push:
        branches: [ "dev" ]

# 권한 설정 (GHCR 패키지 업로드용)
permissions:
    contents: read
    packages: write

env:
    # 이미지 이름 설정 (소문자)
    IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/stargazer-server:latest

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: Set up JDK 17
              uses: actions/setup-java@v3
              with:
                  java-version: '17'
                  distribution: 'temurin'

            # Gradle 빌드 (테스트 제외)
            - name: Build with Gradle
              run: |
                  chmod +x gradlew
                  ./gradlew clean build -x test

            # Docker 이미지 빌드 및 GHCR 푸시
            - name: Build and Push Docker Image
              run: |
                  docker build -t ${{ env.IMAGE_NAME }} .
                  echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
                  docker push ${{ env.IMAGE_NAME }}

            # EC2에 배포 (SSH 접속)
            - name: Deploy to EC2
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.EC2_HOST }}     # EC2 퍼블릭 IP
                  username: ubuntu
                  key: ${{ secrets.EC2_KEY }}       # pem 키 내용
                  port: 22

                  # EC2 내부에서 실행될 스크립트
                  script:
                      # GHCR 로그인
                      echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
                      
                      # 최신 이미지 Pull
                      docker pull ${{ env.IMAGE_NAME }}
                      
                      # 기존 컨테이너 중지 및 삭제 (없으면 에러 무시)
                      docker stop stargazer-app || true
                      docker rm stargazer-app || true
                      
                      # 새 컨테이너 실행 (환경변수 주입!)
                      docker run -d \
                        --name stargazer-app \
                        -p 8080:8080 \
                        -e RDS_ENDPOINT=${{ secrets.RDS_ENDPOINT }} \
                        -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
                        -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
                        -e WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }} \
                        -e GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
                        ${{ env.IMAGE_NAME }}
                      
                      # 미사용 이미지 정리 (공간 확보)
                      docker image prune -f