spring:
    application:
        name: stargazer

    datasource:
        url: jdbc:mysql://${MYSQL_ENDPOINT}:3306/stargazer?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
        username: ${MYSQL_USERNAME}
        password: ${MYSQL_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                # 중요: MySQL 8 버전에 맞는 Dialect 사용 (Spatial 자동 지원)
                dialect: org.hibernate.dialect.MySQLDialect
                # 포맷팅된 SQL 로그 보기 (개발용)
                format_sql: true

        # Hibernate가 테이블을 다 만들 때까지 data.sql 실행을 미룸
        defer-datasource-initialization: true

    sql:
        init:
            mode: always

    cache:
        type: caffeine
        caffeine:
            spec: maximumSize=500, expireAfterWrite=10m # 최대 500개, 쓴 지 10분 뒤 삭제

    security:
        oauth2:
            client:
                registration:
#                    google:
#                        client-id: xxx
#                        client-secret: xxx
#                        scope: profile, email

                    kakao:
                        client-id: ${KAKAO_CLIENT_ID}
                        client-secret: ${KAKAO_CLIENT_SECRET}
                        redirect-uri: "${BASE_URL}/login/oauth2/code/kakao"
                        authorization-grant-type: authorization_code
                        client-authentication-method: client_secret_post
                        client-name: Kakao
                        scope:
                            - profile_nickname
                            - account_email

#                    naver:
#                        client-id: ${KAKAO_CLIENT_ID}
#                        client-secret: ${KAKAO_CLIENT_SECRET}
#                        authorization-grant-type: authorization_code
#                        redirect-uri: "${BASE_URL}/login/oauth2/code/naver"
#                        scope: name, email

                provider:
                    kakao:
                        authorization-uri: https://kauth.kakao.com/oauth/authorize
                        token-uri: https://kauth.kakao.com/oauth/token
                        user-info-uri: https://kapi.kakao.com/v2/user/me
                        user-name-attribute: id

jwt:
    secret: ${JWT_KEY}

weather:
    api:
        key: ${WEATHER_API_KEY}

gemini:
    api:
        key: ${LLM_API_KEY}
