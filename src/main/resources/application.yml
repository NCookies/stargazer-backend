spring:
    application:
        name: stargazer

    datasource:
        url: jdbc:mysql://${MYSQL_ENDPOINT}:3306/stargazer?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
        username: ${MYSQL_USERNAME}
        password: ${MYSQL_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                # 중요: MySQL 8 버전에 맞는 Dialect 사용 (Spatial 자동 지원)
                dialect: org.hibernate.dialect.MySQLDialect
                # 포맷팅된 SQL 로그 보기 (개발용)
                format_sql: true

        # Hibernate가 테이블을 다 만들 때까지 data.sql 실행을 미룸
        defer-datasource-initialization: true

    sql:
        init:
            mode: always

    cache:
        type: redis

    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}

    security:
        oauth2:
            client:
                registration:
                    google:
                        client-id: ${GOOGLE_CLIENT_ID}
                        client-secret: ${GOOGLE_CLIENT_SECRET}
                        redirect-uri: "${SERVER_BASE_URL}/login/oauth2/code/google"
                        scope: profile, email

                    kakao:
                        client-id: ${KAKAO_CLIENT_ID}
                        client-secret: ${KAKAO_CLIENT_SECRET}
                        redirect-uri: "${SERVER_BASE_URL}/login/oauth2/code/kakao"
                        authorization-grant-type: authorization_code
                        client-authentication-method: client_secret_post
                        client-name: Kakao
                        scope:
                            - profile_nickname
                            - account_email

                    naver:
                        client-id: ${NAVER_CLIENT_ID}
                        client-secret: ${NAVER_CLIENT_SECRET}
                        authorization-grant-type: authorization_code
                        redirect-uri: "${SERVER_BASE_URL}/login/oauth2/code/naver"
                        scope: name, email

                provider:
                    kakao:
                        authorization-uri: https://kauth.kakao.com/oauth/authorize
                        token-uri: https://kauth.kakao.com/oauth/token
                        user-info-uri: https://kapi.kakao.com/v2/user/me
                        user-name-attribute: id

                    naver:
                        authorization-uri: https://nid.naver.com/oauth2.0/authorize
                        token-uri: https://nid.naver.com/oauth2.0/token
                        user-info-uri: https://openapi.naver.com/v1/nid/me
                        user-name-attribute: response

jwt:
    secret: ${JWT_KEY}

weather:
    api:
        key: ${WEATHER_API_KEY}

gemini:
    api:
        key: ${GEMINI_API_KEY}

client:
    redirect-base-url: ${CLIENT_REDIRECT_BASE_URL}

springdoc:
    api-docs:
        path: /v3/api-docs
        enabled: true
    swagger-ui:
        path: /swagger-ui.html
        enabled: true
        tags-sorter: alpha
        operations-sorter: alpha
        try-it-out-enabled: true
        filter: true

logging:
    level:
        xyz.ncookie.stargazer.domain.recommend: DEBUG