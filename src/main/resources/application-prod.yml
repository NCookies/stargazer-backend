spring:
    config:
        activate:
            on-profile: prod

    datasource:
        url: jdbc:mysql://${RDS_ENDPOINT}:3306/stargazer?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}

    data:
        redis:
            host: ${REDIS_ENDPOINT}
            port: 6379
